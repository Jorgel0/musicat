name: musicat_server
description: >-
  Musicat Server: the self-hosted backend that wraps slskd and, in later
  phases, powers federated friend-to-friend sharing.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.2

dependencies:
  cryptography: ^2.7.0
  http: ^1.2.2
  path: ^1.9.0
  shelf: ^1.4.2
  shelf_router: ^1.1.2
  shelf_web_socket: ^3.0.0
  uuid: ^4.6.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
