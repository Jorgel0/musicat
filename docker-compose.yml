# Self-hosts the whole Musicat backend: slskd (the Soulseek connection) and
# Musicat Server (wraps slskd, ADR 0016/0017) behind one stable API. See
# docs/self-hosting.md for setup instructions.
#
# Copy .env.example to .env and fill it in first.
services:
  slskd:
    image: slskd/slskd:latest
    container_name: musicat-slskd
    restart: unless-stopped
    ports:
      - "5030:5030" # slskd web UI / REST API
      - "5031:5031" # slskd web UI over HTTPS
      - "50300:50300" # Soulseek P2P listen port — must stay reachable
    environment:
      SLSKD_SLSK_USERNAME: ${SLSKD_SLSK_USERNAME}
      SLSKD_SLSK_PASSWORD: ${SLSKD_SLSK_PASSWORD}
      SLSKD_API_KEY: ${SLSKD_API_KEY}
    volumes:
      - ./data/slskd:/app

  musicat-server:
    build:
      context: ./server
    container_name: musicat-server
    restart: unless-stopped
    depends_on:
      - slskd
    ports:
      - "8080:8080"
    environment:
      SLSKD_HOST: slskd
      SLSKD_PORT: "5030"
      SLSKD_API_KEY: ${SLSKD_API_KEY}
      MUSICAT_DATA_DIR: /app/data
    volumes:
      - ./data/musicat-server:/app/data
